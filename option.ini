[Settings]
ALARM_SOUND = sounds/51X888piCbDG.mp3
SNAPSHOT_DIR = snapshots

; 本地摄像头索引（逗号分隔，如 0,1 ；不使用本地摄像头则留空）
CAM_ID = 0

; 网络摄像头URL（逗号分隔，支持 DroidCam 等 IP 摄像头）
; DroidCam 示例：192.168.3.161:4747  或  http://192.168.3.161:4747/video
; 不使用网络摄像头则留空
; 可与 CAM_ID 同时使用，如：CAM_ID = 0  +  CAM_URLS = 192.168.3.161:4747
CAM_URLS = http://192.168.3.161:4747/

; 每路摄像头旋转角度（顺时针：0/90/180/270），按 CAM_ID + CAM_URLS 顺序对应
; 例如 "0,90" 表示第1路不旋转、第2路顺时针90度；不填默认全部为0
CAM_ROTATE = 0,90

; DroidCam 自动对焦间隔（秒）：连接时对焦一次 + 每隔此秒数自动对焦
; 0 = 禁用定期对焦（仍可在运行时按 'f' 键手动触发）
DROIDCAM_AF_INTERVAL = 30

; 数字变焦倍数（按中心放大），1.0 = 禁用；2.0 = 放大2倍
; 可在下方 [Cam0]/[Cam1] 分段中按摄像头单独覆盖
ZOOM = 1.0

; DroidCam 清晰度（可选：240p / 480p / 720p / 1080p / FHD 1080p / 或 1920x1080）
; 留空 = 使用 DroidCam 默认；URL 中显式写 ?1920x1080 则优先用 URL 中的
DROIDCAM_RESOLUTION = FHD 1080p

PREVIEW = 1
FACE_FRAME = 1

CHECK_INTERVAL = 5
TRIGGER_DELAY = 0.5
BURST_COUNT = 3
BURST_INTERVAL = 1.0
COOLDOWN_SECONDS = 6

Face_Detection_Model = 1
MIN_DETECTION_CONFIDENCE = 0.8
MAX_YAW_ANGLE = 30

ROI_MODE = 2
ROI_GRIDS = 2x2
ROI_TARGETS = 3

FACE_DIR = face
ENABLE_RECOGNITION = 1
RECOGNITION_THRESHOLD = 0.35

; ── 每路摄像头独立配置（可选）──────────────────────────────
; 章节名 Cam0、Cam1 按摄像头顺序对应（先 CAM_ID 后 CAM_URLS）
; 此处设置的参数会覆盖上方 [Settings] 的全局值；未写的参数沿用全局值
; 可覆盖参数：ROI_MODE / ROI_GRIDS / ROI_TARGETS /
;             Face_Detection_Model / MIN_DETECTION_CONFIDENCE / MAX_YAW_ANGLE / ZOOM

; 第1路：本地摄像头 (CAM_ID = 0)
[Cam0]
ROI_MODE = 2
ROI_GRIDS = 2x2
ROI_TARGETS = 3
ZOOM = 1.0

; 第2路：DroidCam 网络摄像头 (CAM_URLS)
[Cam1]
ROI_MODE = 2
ROI_GRIDS = 1x4
ROI_TARGETS = 2,3
ZOOM = 1.0
